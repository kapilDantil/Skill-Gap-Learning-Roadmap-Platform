n-width:55px}.name-row{display:flex;align-items:center;width:100%}.name-row input{flex:1;min-width:0;width:100%}.interest-label{margin:.9rem 0 .6rem!important}.interest-label span{opacity:.7}.interest-options{display:flex;flex-wrap:wrap;gap:7px!important}.interest-options label{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid rgba(185,205,255,.14);border-radius:99px;background:rgba(255,255,255,.025);color:#c8c5e8;font-size:.75rem;cursor:pointer;transition:background .2s,border-color .2s}.interest-options label:has(input:checked){border-color:rgba(124,242,201,.42);background:rgba(124,242,201,.08);color:var(--mint)}.create-action{margin:1.5rem 0 .5rem!important}.create-action button{width:100%;min-height:51px;justify-content:space-between;padding-inline:19px}.fine-print{font-size:.7rem!important;text-align:center;color:#77749f;margin:.65rem 0 0!important}.profile-picks button{margin:3px 0}.profile-manager{display:grid;gap:8px;margin:.55rem 0}.profile-entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid rgba(185,205,255,.13);border-radius:15px;background:rgba(255,255,255,.025)}.profile-entry .profile-name{min-width:0;overflow-wrap:anywhere;font-weight:700;color:#e5e2ff}.profile-entry .profile-actions{display:flex;gap:6px;flex-shrink:0}.profile-entry button{min-height:35px;padding:7px 11px;font-size:.76rem}.profile-manager-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.profile-manager-head .subhead{margin-bottom:.6rem!important}.profile-delete-note{font-size:.72rem;color:var(--muted);line-height:1.55;margin:.55rem 0}
/* Roadmap timeline */

/* MOTION LAB — persistent 3D atmosphere + animated interactions on every view */
.ambient{perspective:1100px;transform-style:preserve-3d}
.float-orb{position:absolute;display:grid;place-items:center;border-radius:50%;transform-style:preserve-3d;will-change:transform;pointer-events:none;mix-blend-mode:screen}
.float-orb::before,.float-orb::after,.float-orb span{content:"";position:absolute;inset:0;border-radius:50%;}
.float-orb::before{background:radial-gradient(circle at 28% 23%,rgba(255,255,255,.95),rgba(127,180,255,.42) 8%,rgba(157,123,255,.22) 30%,rgba(7,6,26,.04) 65%,transparent 70%);box-shadow:inset -14px -18px 35px rgba(3,3,25,.65),inset 7px 8px 24px rgba(255,255,255,.16),0 0 60px rgba(127,180,255,.12)}
.float-orb::after{inset:9%;border:1px solid rgba(255,255,255,.25);transform:rotateX(67deg) rotateZ(-24deg) scale(1.22);box-shadow:0 0 24px rgba(124,242,201,.12)}
.float-orb span{inset:-14%;border:1px solid rgba(124,242,201,.18);transform:rotateY(66deg) rotateX(18deg);}
.orb-one{width:clamp(100px,14vw,210px);height:clamp(100px,14vw,210px);top:14%;right:7%;animation:orbFlightOne 17s ease-in-out infinite}
.orb-two{width:clamp(58px,7vw,105px);height:clamp(58px,7vw,105px);top:52%;left:4%;filter:hue-rotate(55deg);animation:orbFlightTwo 13s ease-in-out infinite}
.orb-three{width:clamp(38px,4vw,64px);height:clamp(38px,4vw,64px);bottom:9%;right:19%;filter:hue-rotate(145deg);animation:orbFlightThree 11s ease-in-out infinite}
@keyframes orbFlightOne{0%,100%{transform:translate3d(0,0,0) rotateX(0) rotateY(0)}25%{transform:translate3d(-34px,24px,80px) rotateX(20deg) rotateY(35deg)}55%{transform:translate3d(-12px,68px,-30px) rotateX(-15deg) rotateY(75deg)}80%{transform:translate3d(24px,28px,40px) rotateX(12deg) rotateY(20deg)}}
@keyframes orbFlightTwo{0%,100%{transform:translate3d(0,0,0) rotateY(0)}35%{transform:translate3d(34px,-35px,45px) rotateY(120deg)}70%{transform:translate3d(-12px,30px,-15px) rotateY(240deg)}}
@keyframes orbFlightThree{0%,100%{transform:translate3d(0,0,0) rotateZ(0)}50%{transform:translate3d(-55px,-42px,30px) rotateZ(180deg)}}
.wire-cube{position:absolute;width:48px;height:48px;transform-style:preserve-3d;opacity:.38;will-change:transform}
.wire-cube i{position:absolute;inset:0;border:1px solid rgba(124,242,201,.62);background:linear-gradient(135deg,rgba(124,242,201,.05),rgba(157,123,255,.04));box-shadow:inset 0 0 20px rgba(127,180,255,.04)}
.wire-cube i:nth-child(1){transform:translateZ(24px)}.wire-cube i:nth-child(2){transform:rotateY(180deg) translateZ(24px)}.wire-cube i:nth-child(3){transform:rotateY(90deg) translateZ(24px)}.wire-cube i:nth-child(4){transform:rotateY(-90deg) translateZ(24px)}.wire-cube i:nth-child(5){transform:rotateX(90deg) translateZ(24px)}.wire-cube i:nth-child(6){transform:rotateX(-90deg) translateZ(24px)}
.cube-one{top:34%;left:17%;animation:cubeSpin 19s linear infinite}.cube-two{right:29%;top:13%;width:26px;height:26px;opacity:.24;transform:scale(.55);animation:cubeSpin 14s linear infinite reverse}.cube-two i:nth-child(1){transform:translateZ(13px)}.cube-two i:nth-child(2){transform:rotateY(180deg) translateZ(13px)}.cube-two i:nth-child(3){transform:rotateY(90deg) translateZ(13px)}.cube-two i:nth-child(4){transform:rotateY(-90deg) translateZ(13px)}.cube-two i:nth-child(5){transform:rotateX(90deg) translateZ(13px)}.cube-two i:nth-child(6){transform:rotateX(-90deg) translateZ(13px)}
@keyframes cubeSpin{0%{transform:rotateX(0) rotateY(0) rotateZ(0) translateY(0)}50%{transform:rotateX(180deg) rotateY(270deg) rotateZ(90deg) translateY(-35px)}100%{transform:rotateX(360deg) rotateY(540deg) rotateZ(180deg) translateY(0)}}
.orbit{position:absolute;width:clamp(180px,25vw,360px);height:clamp(180px,25vw,360px);border:1px solid rgba(157,123,255,.19);border-radius:50%;transform-style:preserve-3d;opacity:.45}
.orbit::before,.orbit::after{content:"";position:absolute;inset:12%;border:1px solid rgba(127,180,255,.15);border-radius:50%;transform:rotateX(65deg) rotateY(18deg)}.orbit::after{inset:-8%;transform:rotateY(68deg) rotateX(18deg);border-color:rgba(124,242,201,.14)}.orbit i{position:absolute;top:50%;left:-5px;width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 18px var(--mint)}.orbit-one{left:-10%;bottom:2%;animation:orbitTurn 28s linear infinite}.orbit-two{right:-13%;top:31%;transform:scale(.7);animation:orbitTurn 34s linear infinite reverse;opacity:.22}
@keyframes orbitTurn{from{transform:rotateX(58deg) rotateZ(0deg)}to{transform:rotateX(58deg) rotateZ(360deg)}}
.spark-field{position:absolute;inset:0;opacity:.52;background-image:radial-gradient(circle,rgba(236,233,255,.7) 1px,transparent 1.6px),radial-gradient(circle,rgba(124,242,201,.65) 1px,transparent 1.8px),radial-gradient(circle,rgba(255,107,53,.55) 1px,transparent 1.6px);background-size:83px 91px,127px 137px,191px 173px;background-position:0 0,37px 52px,71px 24px;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 70%,transparent);animation:starDrift 42s linear infinite}
@keyframes starDrift{to{background-position:83px 182px,164px -85px,-120px 197px}}
/* Each newly rendered screen arrives with a cinematic depth entrance. */
.motion-enter{animation:tileEntrance .68s var(--ease) both}
@keyframes tileEntrance{from{opacity:0;transform:perspective(900px) translate3d(0,24px,-50px) rotateX(5deg) scale(.985);filter:blur(4px)}to{opacity:1;transform:perspective(900px) translate3d(0,0,0) rotateX(0) scale(1);filter:blur(0)}}
main#m{perspective:1300px;transform-style:preserve-3d}
main#m>.welcome-layout,main#m>.page-hero,main#m>h1,main#m>.row,main#m>.grid,main#m>.card,main#m>.section-heading,main#m>p,main#m>ul,main#m>.ms,main#m>a{animation:screenRise .72s var(--ease) both}
main#m>.grid,main#m>.row{animation-delay:.06s}main#m>.section-heading{animation-delay:.12s}main#m>.card{animation-delay:.08s}
@keyframes screenRise{from{opacity:0;transform:translate3d(0,24px,-45px) rotateX(2deg);filter:blur(5px)}to{opacity:1;transform:translate3d(0,0,0) rotateX(0);filter:blur(0)}}
.card{transform-style:preserve-3d;will-change:transform;backface-visibility:hidden}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;background:linear-gradient(115deg,transparent 15%,rgba(255,255,255,.075) 32%,transparent 48%);transform:translateX(-130%);transition:opacity .3s}
.card:hover::after{opacity:1;animation:cardGleam .85s ease}
@keyframes cardGleam{to{transform:translateX(130%)}}
.stat-grid .card{overflow:visible}.stat-grid .card::before{z-index:0;inset:-1px;border-radius:inherit;background:radial-gradient(220px circle at var(--lx,50%) var(--ly,0%),rgba(124,242,201,.16),transparent 68%)}
.stat-grid .card:nth-child(odd){animation:floatCardA 7s ease-in-out infinite}.stat-grid .card:nth-child(even){animation:floatCardB 8s ease-in-out infinite}.stat-grid .card:nth-child(3n){animation-delay:-3s}
@keyframes floatCardA{0%,100%{translate:0 0}50%{translate:0 -5px}}@keyframes floatCardB{0%,100%{translate:0 0}50%{translate:0 4px}}
.career-glyph,.logo-mark{position:relative;transform-style:preserve-3d;animation:glyphHover 5s ease-in-out infinite;box-shadow:0 12px 30px rgba(124,242,201,.08),inset 0 1px 0 rgba(255,255,255,.6)}
@keyframes glyphHover{0%,100%{transform:translateY(0) rotateY(0) rotateX(0)}50%{transform:translateY(-5px) rotateY(18deg) rotateX(8deg)}}
.bar i,.career-mini-bar i{position:relative;overflow:hidden}.bar i::after,.career-mini-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%);animation:progressShine 3.8s ease-in-out infinite}
@keyframes progressShine{65%,100%{transform:translateX(120%)}}
button,.btn{transform-style:preserve-3d}button::after,.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.18),transparent 70%);transform:translateX(-120%);transition:transform .5s}button:hover::after,.btn:hover::after{transform:translateX(120%)}
main h1{animation:headingFocus .9s var(--ease) both;text-shadow:0 0 38px rgba(157,123,255,.12)}@keyframes headingFocus{from{opacity:0;letter-spacing:-.075em;transform:translateY(14px)}to{opacity:1;letter-spacing:-.04em;transform:translateY(0)}}
.logo-mark{animation:logoPulse 4s ease-in-out infinite}@keyframes logoPulse{0%,100%{box-shadow:0 6px 24px rgba(124,242,201,.18),0 0 0 0 rgba(124,242,201,.0)}50%{box-shadow:0 8px 32px rgba(124,242,201,.28),0 0 0 7px rgba(124,242,201,.035)}}
.local-pill::before{animation:statusPulse 2.4s ease-in-out infinite}@keyframes statusPulse{50%{box-shadow:0 0 3px rgba(124,242,201,.5);opacity:.55}}
.ms{position:relative;transition:transform .28s,border-color .28s,background .28s;border-radius:0 16px 16px 0}.ms:hover{transform:translateX(5px);background:rgba(255,255,255,.025)}
.welcome-panel{transform-style:preserve-3d}.welcome-panel .mini-spark{display:inline-block;animation:sparkRotate 8s linear infinite;filter:drop-shadow(0 0 12px rgba(255,107,53,.5))}@keyframes sparkRotate{to{transform:rotate(360deg)}}
.toast-in{animation:toastPop .4s var(--ease) both}@keyframes toastPop{from{opacity:0;transform:translate(-50%,20px) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@media(max-width:800px){.orb-one{right:-9%;top:16%;opacity:.55}.orb-two{left:-2%;top:65%}.cube-one{left:3%;top:38%}.orbit-one{left:-30%;opacity:.22}.orbit-two{right:-35%}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.float-orb,.wire-cube,.orbit{opacity:.18}.spark-field{opacity:.22}.stat-grid .card{animation:none}.card:hover{transform:translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.float-orb,.wire-cube,.orbit,.spark-field,.stat-grid .card,.career-glyph,.logo-mark,.local-pill::before,.bar i::after,.career-mini-bar i::after,.welcome-panel .mini-spark{animation:none!important}main#m>*{animation:none!important}.card::after{display:none}}



/* ═══ MOTION OVERDRIVE · scroll-reactive 3D + deeper glass ═══ */
:root{--glass-hi:rgba(255,255,255,.105);--glass-low:rgba(13,12,42,.58);--edge:rgba(199,214,255,.24);--scroll-depth:0}
body.app-shell{background:radial-gradient(ellipse at 50% -15%,rgba(86,70,210,.27),transparent 45%),radial-gradient(ellipse at 100% 25%,rgba(255,107,53,.095),transparent 32%),radial-gradient(ellipse at 0% 75%,rgba(31,210,190,.075),transparent 35%),var(--ink)}
/* fixed 3D sculpture stays behind every route and changes position with scroll */
.scroll-sculpture{position:fixed;z-index:0;right:clamp(-120px,4vw,80px);top:18vh;width:clamp(180px,24vw,360px);aspect-ratio:1;pointer-events:none;transform-style:preserve-3d;opacity:.7;filter:drop-shadow(0 20px 70px rgba(98,91,255,.16));will-change:transform}
.sculpture-core{position:absolute;inset:27%;border-radius:28%;background:radial-gradient(circle at 27% 20%,#fff9 0 2%,#a8e8ffb8 5%,#9176ff88 19%,#21174a66 53%,#07061a00 74%);border:1px solid #d9d5ff55;box-shadow:inset -18px -16px 38px #03020c99,inset 8px 8px 26px #fff3,0 0 45px #8c80ff38;backdrop-filter:blur(4px);transform:translateZ(35px) rotateX(28deg) rotateY(-32deg);animation:corePulse 5s ease-in-out infinite}
.sculpture-ring{position:absolute;inset:8%;border:1px solid #9d7bff77;border-radius:50%;transform:rotateX(68deg) rotateY(-22deg);box-shadow:0 0 28px #8d7aff1b;animation:sculptureSpin 18s linear infinite}
.sculpture-ring.r2{inset:1%;border-color:#7cf2c966;transform:rotateY(66deg) rotateX(20deg);animation-duration:25s;animation-direction:reverse}
.sculpture-ring.r3{inset:18%;border-color:#ff986d77;transform:rotateX(25deg) rotateY(55deg) rotateZ(40deg);animation-duration:14s}
.sculpture-node{position:absolute;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 30% 25%,white,#7cf2c9 34%,#5d50ff 78%);box-shadow:0 0 20px #7cf2c9aa;transform:translateZ(75px);animation:nodeBob 4s ease-in-out infinite}
.sculpture-node.n1{left:14%;top:31%}.sculpture-node.n2{right:8%;top:54%;background:radial-gradient(circle at 30% 25%,white,#ff9c72 40%,#ff6b35 80%);animation-delay:-1.4s}.sculpture-node.n3{left:48%;bottom:4%;width:8px;height:8px;animation-delay:-2.5s}
.sculpture-shard{position:absolute;width:32px;height:32px;border:1px solid #d7d2ff66;background:linear-gradient(135deg,#ffffff18,#7cf2c90a);backdrop-filter:blur(5px);transform:rotate(45deg) translateZ(65px);animation:shardFloat 8s ease-in-out infinite}
.sculpture-shard.s1{left:4%;bottom:25%}.sculpture-shard.s2{right:12%;top:14%;width:20px;height:20px;animation-delay:-3s}
@keyframes corePulse{0%,100%{filter:brightness(.92);transform:translateZ(35px) rotateX(28deg) rotateY(-32deg) scale(.96)}50%{filter:brightness(1.25);transform:translateZ(55px) rotateX(38deg) rotateY(8deg) scale(1.06)}}
@keyframes sculptureSpin{to{rotate:0 0 1 360deg}}
@keyframes nodeBob{0%,100%{translate:0 0 0}50%{translate:0 -16px 22px}}

<script>

["fe","Frontend Developer","Web","Build interactive, accessible interfaces in the browser.",1,120,["HTML","CSS","JavaScript","Git","Responsive Design","Accessibility"],"Responsive portfolio + API-driven app"],

["da","Data Analyst","Data","Turn data into insight and decisions.",1,110,["Statistics","SQL","Spreadsheets","Python","Data Visualisation"],"Analysis report with dashboard"],

const SB_URL = "https://kvvwogugysoebvfphykj.supabase.co";
const SB_KEY = "sb_publishable_xrJbAp_4wsITom-zQrOxgA_DBXvRnOf";
const cloudConfigured = SB_URL !== "YOUR_PROJECT_URL" && SB_KEY !== "YOUR_ANON_OR_PUBLISHABLE_KEY";
const SB = cloudConfigured && window.supabase
  ? window.supabase.createClient(SB_URL, SB_KEY)
  : null;
let cloudUser = null, pushT;
function save(){
  try {
    localStorage.setItem("ss1", JSON.stringify(db));
    cloudPush();
    return true;
  } catch(e) {
    toast("Could not save: browser storage is unavailable or full. Changes may be lost.", 1);

function cloudPush(){
  if(!SB || !cloudUser) return;
  clearTimeout(pushT);
  pushT = setTimeout(async()=>{
    const r = await SB.from("app_data").upsert({user_id:cloudUser.id, data:db});
    if(r.error) toast("Cloud sync failed. Your data is still saved on this device.", 1);
  }, 800);
}
async function cloudPull(){
  if(!SB || !cloudUser) return;
  const g = await SB.from("app_data").select("data").eq("user_id", cloudUser.id).maybeSingle();
  if(g.error){toast("Could not load cloud data. Your local data is unchanged.",1);return}
  if(g.data && g.data.data && g.data.data.v === 1){
    db = g.data.data;
    localStorage.setItem("ss1", JSON.stringify(db));
  } else {
    cloudPush();
  }
  render();
}
async function syncSubmit(f){
  if(!SB) return toast("Cloud sync isn't available right now. Check your connection and reload the page.",1);
  const email=$("#se").value.trim(), pw=$("#sp").value;
  if(!/^\S+@\S+\.\S+$/.test(email)) return toast("Enter a valid email address.",1);
  if(pw.length<6) return toast("Password must be at least 6 characters.",1);
  const btn=f.querySelector("button[type=submit]"); btn.disabled=true;
  try{
    let r=await SB.auth.signInWithPassword({email,password:pw});
    if(r.error){
      const u=await SB.auth.signUp({email,password:pw});
      if(u.error) return toast(u.error.message,1);
      if(u.data.user && u.data.user.identities && !u.data.user.identities.length) return toast("Incorrect password for this email.",1);
      if(!u.data.session) return toast("Check your email to confirm your account, then sign in again.",1);
      r=u;
    }
    cloudUser=r.data.user;
    await cloudPull();
    toast("Cloud sync is on");
  }catch(err){toast("Could not reach the sync service. Try again.",1)}
  finally{btn.disabled=false}
}
async function syncOut(){
  if(SB) await SB.auth.signOut();
  cloudUser=null;
  toast("Signed out of cloud sync. Your data stays on this device.");

}

   ?`<h3>You're synced</h3><p class="mu">Signed in as <b class="sync-mail">${E(cloudUser.email||"your account")}</b>. Your profiles are backed up and available on your other devices.</p><button type="button" class="dan" data-a="syncout">Sign out <span aria-hidden="true">↗</span></button>`
   :`<h3>Sign in to sync devices</h3><p class="mu">Optional. Use your email to back up your profiles and pick up where you left off on any device.</p><form id="syncform" class="sync-form" novalidate><label class="sr" for="se">Email</label><input id="se" type="email" autocomplete="email" placeholder="you@example.com"><label class="sr" for="sp">Password</label><input id="sp" type="password" autocomplete="current-password" placeholder="Password (6+ characters)"><button class="pri" type="submit">Continue with email <span aria-hidden="true">↗</span></button></form><p class="fine-print">New here? We'll create your account automatically.</p>`)+`</div>`;
}

function gap(c){const sk=P().skills;return c.r.map(s=>{const u=sk[s];let k,w;
if(!u){k="Missing";w="No entry in your skills."}else if(u.s==="Mastered"){k="Matched";w="You marked it Mastered (self-assessed)."}else if(u.s==="To Learn"){k="Needs Review";w="On your list but not started."}else{k="In Progress";w="You marked it "+u.s+"."}return{s,k,w}})}
function score(c){const g=gap(c),n=g.length,m=g.filter(x=>x.k==="Matched").length/n,p=g.filter(x=>x.k==="In Progress").length/n,ints=P().interests,hasI=ints.length>0,i=ints.includes(c.c)?1:0;
const W=.5+.2+(hasI?.2:0);return{v:Math.round((.5*m+.2*p+(hasI?.2*i:0))/W*100),g,hasI,i}}
function rec(c){const s=score(c),m=s.g.filter(x=>x.k==="Matched").map(x=>x.s),ms_=s.g.filter(x=>x.k==="Missing").map(x=>x.s);
return `${m.length?"You have marked "+m.join(", ")+" as mastered. ":"You have no mastered skills for this role yet. "}${s.i?"It matches your declared interest in "+c.c+". ":""}${ms_.length?"Missing: "+ms_.slice(0,3).join(", ")+". ":""}`}

${ps.length?`<div class="profile-manager-head"><h3 class="subhead">Profiles in this sync account</h3><button class="dan" data-a="delallprofiles">Remove all</button></div><div class="profile-manager">${ps.map(p=>`<div class="profile-entry"><span class="profile-name">${E(p.name)}</span><div class="profile-actions"><button data-a="open" data-id="${E(p.id)}">Open</button><button class="dan" data-a="delprofile" data-id="${E(p.id)}" aria-label="Delete profile ${E(p.name)}">Delete</button></div></div>`).join("")}</div><p class="profile-delete-note">Deleting a profile removes its saved skills, roadmaps, and progress. When Cloud Sync is signed in, the change is synced to that account.</p>`:""}
<h3 class="subhead">Your display name</h3><div class="row name-row"><label class="field-label" for="pn">Name</label><input id="pn" maxlength="30" autocomplete="off" placeholder="What should we call you?"></div>

<div class="section-heading"><div><span class="eyebrow">IN MOTION</span><h2>Continue learning</h2></div><a class="text-link" href="#/roadmaps">All roadmaps <span>→</span></a></div>${rs.length?`<div class="grid">${rs.map(roadCard).join("")}</div>`:`<div class="card">You have not started any roadmap. Browse <a href="#/explore">Explore Careers</a>, review one and choose Start This Roadmap when you are ready.</div>`}

function roadCard(r){const s=rstat(r);return `<div class="card roadmap-card"><div class="roadmap-card-head"><span class="career-glyph">${E(s.c.t.split(/\s+/).map(x=>x[0]).join("").slice(0,2))}</span>${bdg(r.status)}</div><h3>${E(s.c.t)}</h3><div class="mu">${E(s.c.c)} · ${s.d}/${s.all.length} milestones</div><div class="progress-label"><span>Roadmap progress</span><b>${s.pct}%</b></div>${bar(s.pct,s.c.t+" progress")}<p class="next-step"><span class="next-label">NEXT UP</span><br>${s.next?E(s.next.t):"All milestones complete"}</p><a class="btn" href="#/roadmap/${r.cid}">Open roadmap <span>↗</span></a></div>`}

function careerView(id){const c=career(id);if(!c)return `<div class="card">Career not found. <a href="#/explore">Back to Careers</a></div>`;const s=score(c),rm=P().roadmaps[id],M=ms(c);
return `<a href="#/explore">← Back to Careers</a><h1>${E(c.t)}</h1><p>${E(c.d)} ${bdg(c.c)}${bdg(LV[c.l])}</p><div class="card"><h2>Your skill gap</h2><p class="mu">Heuristic overlap: <b>${s.v}%</b>. Formula: 50% mastered + 20% in progress + 20% declared interest${s.hasI?"":" (no interests set, so weights are rescaled)"}. This is not a measure of ability or hiring likelihood. Skill levels are self-reported.</p>
<ul>${s.g.map(x=>`<li>${E(x.s)} ${bdg(x.k)} <span class="mu">${E(x.w)}</span> ${x.k==="Missing"?`<button data-a="addsk" data-id="${E(x.s)}">Add to My Skills</button>`:""}</li>`).join("")}</ul><p>${E(rec(c))}</p></div>

${rm?`<a class="btn pri" href="#/roadmap/${id}">Open Existing Roadmap</a>`:`<button class="pri" data-a="start" data-id="${id}">Start This Roadmap</button>`}</div>`}

function ssBanner(){if(document.querySelector(".cb"))return;const b=document.createElement("div");b.className="cb";b.setAttribute("role","region");b.setAttribute("aria-label","Cookie consent");b.innerHTML='<div class="cb-head"><i aria-hidden="true">◈</i> Cookies &amp; storage</div><p>We keep your profile on this device. Optional storage is used only for cloud sync sign-in. <a href="#/privacy">Privacy policy</a></p><div class="row"><button type="button" id="cb-e">Reject</button><button type="button" class="pri" id="cb-a">Accept</button></div>';document.body.append(b);b.querySelector("#cb-a").onclick=()=>ssConsent("all");b.querySelector("#cb-e").onclick=()=>ssConsent("essential")}
document.addEventListener("DOMContentLoaded",()=>{
document.querySelectorAll("[data-year]").forEach(e=>e.textContent=new Date().getFullYear());
document.querySelectorAll("[data-consent-open]").forEach(b=>b.onclick=ssBanner);
let v=null;try{v=localStorage.getItem("ss_consent")}catch(e){}if(!v)ssBanner()});
</script>

<!-- SS MODE SWITCH (integration layer): adds the mode button and the messages the host page (index.html) uses to swap modes. Nothing above this line is changed except where noted in index.html's notes. -->
<style id="ss-mode-css">
.mode-switch{position:relative;display:inline-flex;margin-left:auto;flex-shrink:0}
.mode-switch .mode-btn{min-height:38px;padding:8px 15px;font-size:.8rem;color:var(--mint);border-color:rgba(124,242,201,.4)}
.mode-switch .mode-btn:disabled{opacity:.55}
.mode-tip{position:absolute;right:0;top:calc(100% + 10px);width:min(270px,72vw);padding:10px 12px;border-radius:12px;font-size:.75rem;line-height:1.5;font-weight:600;text-align:left;color:var(--muted,#bcb8e4);background:rgba(12,14,37,.97);border:1px solid rgba(185,205,255,.22);box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .2s,transform .2s,visibility .2s;pointer-events:none;z-index:60}
.mode-switch:hover .mode-tip,.mode-switch:focus-within .mode-tip{opacity:1;visibility:visible;transform:none}
@media(prefers-reduced-motion:reduce){.mode-tip{transition:none}}
</style>
<script>
(function(){
 "use strict";
 var MODE="high",TO="fast";
 if(window.parent===window)return; // opened on its own: leave the page exactly as it was
 var host=document.querySelector(".app-header");if(!host)return;
 var wrap=document.createElement("span");wrap.className="mode-switch";
 var b=document.createElement("button");b.type="button";b.className="mode-btn";b.id="ss-mode-btn";b.textContent="Fast Mode";b.title="Fast Mode reduces resource-intensive visual effects and 3D rendering to improve performance on low-end devices.";b.setAttribute("aria-describedby","ss-mode-tip");
 var tip=document.createElement("span");tip.className="mode-tip";tip.id="ss-mode-tip";tip.setAttribute("role","tooltip");tip.textContent="Fast Mode reduces resource-intensive visual effects and 3D rendering to improve performance on low-end devices.";
 wrap.append(b,tip);host.append(wrap);
 b.addEventListener("click",function(){b.disabled=true;parent.postMessage({type:"ss-switch",to:TO,hash:location.hash},"*")});
 function post(){parent.postMessage({type:"ss-state",mode:MODE,hash:location.hash,title:document.title},"*")}
 addEventListener("hashchange",function(){setTimeout(post,60)});post();
 try{if(typeof SB!=="undefined"&&SB&&typeof cloudUser!=="undefined"){SB.auth.getSession().then(function(r){var s=r&&r.data&&r.data.session;if(s&&!cloudUser){cloudUser=s.user;try{render()}catch(x){}}},function(){})}}catch(x){}
 // flush any pending cloud save before this document is torn down
 function flush(){try{if(typeof SB!=="undefined"&&SB&&typeof cloudUser!=="undefined"&&cloudUser){clearTimeout(pushT);return Promise.resolve(SB.from("app_data").upsert({user_id:cloudUser.id,data:db})).then(function(){},function(){})}}catch(x){}return Promise.resolve()}
 addEventListener("message",function(e){if(e.source!==parent)return;var d=e.data;if(!d||typeof d!=="object")return;
  if(d.type==="ss-prepare"){try{var c=document.getElementById("gl3d"),g=c&&(c.getContext("webgl2")||c.getContext("webgl")),x=g&&g.getExtension("WEBGL_lose_context");if(x)x.loseContext()}catch(z){}flush().then(function(){parent.postMessage({type:"ss-ready"},"*")})}
  else if(d.type==="ss-goto"&&typeof d.hash==="string"&&/^#\/[\w\-\/]*$/.test(d.hash)&&location.hash!==d.hash){location.hash=d.hash}});
})();
</script>
</body></html>
