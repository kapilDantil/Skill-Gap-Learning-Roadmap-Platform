<dialog id="dlg"><form method="dialog"><p id="dq"></p><div class="row"><button value="n">Cancel</button><button value="y" class="pri">Confirm</button></div></form></dialog>
<dialog id="adlg" aria-labelledby="adt"><h2 id="adt">Cloud sync account</h2><p class="mu">Use your email and a password of at least 6 characters.</p><div><label for="ae1">Email</label><br><input id="ae1" type="email" autocomplete="email" maxlength="120"></div><div style="margin-top:10px"><label for="ae2">Password</label><br><input id="ae2" type="password" autocomplete="current-password" maxlength="72"></div><p class="aerr" id="ae" role="alert"></p><div class="row" style="margin-top:12px"><button type="button" data-a="acancel">Cancel</button><button type="button" data-a="signup">Create account</button><button type="button" class="pri" data-a="signin">Sign in</button></div></dialog>
<script>
"use strict";
// ---------- DATA ----------
const CAT=[
["fe","Frontend Developer","Web","Build interactive, accessible interfaces in the browser.",1,120,["HTML","CSS","JavaScript","Git","Responsive Design","Accessibility"],"Responsive portfolio + API-driven app"],
["be","Backend Developer","Web","Design servers, APIs and data storage.",2,150,["Programming Basics","Git","SQL","APIs","Authentication","Testing"],"REST API with a database"],
["fs","Full-Stack Developer","Web","Work across frontend, backend and data.",2,200,["HTML","CSS","JavaScript","APIs","SQL","Git"],"End-to-end web application"],
["se","Software Engineer","Software","Build reliable software using solid fundamentals.",2,180,["Programming Basics","Data Structures","Algorithms","Git","Testing","System Design"],"Multi-module application with tests"],
["mob","Mobile App Developer","Software","Create apps for phones and tablets.",2,150,["Programming Basics","Git","APIs","UI Design","Testing"],"Published-quality mobile app"],
["gd","Game Developer","Software","Build interactive games and engines.",2,170,["Programming Basics","Math","Data Structures","Game Engines","Git"],"Playable 2D game"],
["da","Data Analyst","Data","Turn data into insight and decisions.",1,110,["Statistics","SQL","Spreadsheets","Python","Data Visualisation"],"Analysis report with dashboard"],
["ds","Data Scientist","Data","Model data and test hypotheses.",3,200,["Python","Statistics","SQL","Machine Learning","Data Visualisation","Math"],"End-to-end modelling notebook"],
["ml","Machine Learning Engineer","AI","Build and deploy machine-learning systems.",3,230,["Python","Math","Statistics","Machine Learning","Git","APIs"],"Trained and served model"],
["ai","AI Application Developer","AI","Build products on top of existing AI models.",2,130,["Programming Basics","Python","APIs","Prompt Design","Git"],"AI-powered app"],
["sec","Cybersecurity Analyst","Security","Detect and reduce security risks.",2,170,["Networking","Linux","Security Fundamentals","Scripting","Cryptography"],"Home-lab security assessment"],
["cl","Cloud Engineer","Infrastructure","Run applications on cloud platforms.",2,150,["Linux","Networking","Cloud Platforms","Scripting","Git"],"Deployed cloud architecture"],
["do","DevOps Engineer","Infrastructure","Automate building, testing and deploying software.",3,170,["Linux","Git","Scripting","CI/CD","Containers","Cloud Platforms"],"Automated deployment pipeline"],
["ux","UI/UX Designer","Design","Design usable, attractive products.",1,100,["Design Principles","User Research","Wireframing","Prototyping","Accessibility"],"Case study with prototype"],
["qa","Software QA Engineer","Software","Ensure software quality through testing.",1,110,["Programming Basics","Testing","Git","Test Automation","Scripting"],"Automated test suite"],
["dbe","Database Engineer","Data","Design and tune data storage.",2,140,["SQL","Data Modelling","Linux","Performance Tuning","Scripting"],"Normalised, indexed database"],
["bi","Business Intelligence Analyst","Data","Build reports and dashboards for decision makers.",1,100,["SQL","Spreadsheets","Data Visualisation","Statistics","Data Modelling"],"BI dashboard"],
["sys","Systems Programmer","Software","Write low-level, performance-critical software.",3,220,["Programming Basics","Data Structures","C Language","Operating Systems","Algorithms","Linux"],"Mini shell or allocator"]
].map(a=>({id:a[0],t:a[1],c:a[2],d:a[3],l:a[4],h:a[5],r:a[6],pj:a[7]}));
const LV=["","Beginner","Intermediate","Advanced"],STS=["To Learn","Learning","Practising","Mastered"];
const ALLSK=[...new Set(CAT.flatMap(c=>c.r))].sort(),CATS=[...new Set(CAT.map(c=>c.c))];
function ms(c){const r=c.r,n=r.length,o=r.map((s,i)=>({id:c.id+"-"+i,st:i<2?"Foundations":"Core Skills",t:"Learn "+s,sk:s,p:i<2?[]:i==2?[c.id+"-0",c.id+"-1"]:[c.id+"-"+(i-1)],h:Math.round(c.h*.7/n)}));
o.push({id:c.id+"-p",st:"Projects",t:"Build: "+c.pj,p:[c.id+"-"+(n-1)],h:Math.round(c.h*.2)},{id:c.id+"-j",st:"Portfolio",t:"Portfolio and job preparation",p:[c.id+"-p"],h:Math.round(c.h*.1)});return o}
// ---------- STATE ----------
let db=null;try{db=JSON.parse(localStorage.getItem("ss1"))}catch(e){}
if(!db||db.v!==1||typeof db.profiles!=="object")db={v:1,cur:null,profiles:{}};
const F={q:"",c:"",l:"",h:false};
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=()=>db.profiles[db.cur],career=id=>CAT.find(c=>c.id===id),now=()=>new Date().toISOString();
// ---------- OPTIONAL CLOUD SYNC (loads only after consent; keys live in site.js) ----------
let SB=null,cloudUser=null,pushT;
const hasConsent=()=>{try{return localStorage.getItem("ss_consent")==="all"}catch(e){return false}};
function loadSB(){return new Promise(res=>{if(SB)return res(SB);if(!hasConsent()||!SITE.sbUrl)return res(null);const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";s.onload=()=>{SB=window.supabase.createClient(SITE.sbUrl,SITE.sbKey);SB.auth.getSession().then(({data})=>{if(data.session){cloudUser=data.session.user;cloudPull()}});res(SB)};s.onerror=()=>{toast("Cloud sync could not load. Check your connection and try again.",1);res(null)};document.head.append(s)})}
function save(){try{localStorage.setItem("ss1",JSON.stringify(db));cloudPush();return true}catch(e){toast("Could not save: browser storage is unavailable or full. Changes may be lost.",1);return false}}
function cloudPush(){if(!SB||!cloudUser)return;clearTimeout(pushT);pushT=setTimeout(async()=>{const r=await SB.from("app_data").upsert({user_id:cloudUser.id,data:db});if(r.error)toast("Cloud sync failed. Your data is still saved on this device.",1)},800)}
async function cloudPull(askFirst){if(!SB||!cloudUser)return;const g=await SB.from("app_data").select("data").eq("user_id",cloudUser.id).maybeSingle();if(g.error){toast("Could not load cloud data. Your local data is unchanged.",1);return}
if(g.data&&g.data.data&&g.data.data.v===1){if(askFirst&&Object.keys(db.profiles).length&&!await ask("Saved data was found in your cloud account. Replace the data on this device with it? Choose Keep this device to overwrite the cloud copy instead.","Use cloud data","Keep this device")){cloudPush();return}db=clean(g.data.data);try{localStorage.setItem("ss1",JSON.stringify(db))}catch(e){}}else cloudPush();render()}
function cloudCard(){if(!SITE.sbUrl)return '<p class="mu">Cloud sync is not set up for this site.</p>';if(!hasConsent())return '<p class="mu">Cloud sync needs optional storage, which is currently off.</p><button data-a="consent">Allow optional storage</button>';if(cloudUser)return `<p>Signed in as <b>${E(cloudUser.email||"your account")}</b>. Changes sync automatically.</p><button data-a="cout">Sign out</button>`;return '<p class="mu">Sign in to keep your profiles in sync across devices.</p><button data-a="cin">Sign in or create account</button>'}
function clean(d){if(!d||d.v!==1||!d.profiles||typeof d.profiles!=="object")return{v:1,cur:null,profiles:{}};for(const[k,p]of Object.entries(d.profiles)){if(!p||typeof p.name!=="string"){delete d.profiles[k];continue}p.id=k;p.interests=(Array.isArray(p.interests)?p.interests:[]).filter(i=>CATS.includes(i));p.skills=p.skills&&typeof p.skills==="object"?p.skills:{};p.roadmaps=p.roadmaps&&typeof p.roadmaps==="object"?p.roadmaps:{};for(const c of Object.keys(p.roadmaps)){const r=p.roadmaps[c];if(!career(c)||!r||!r.done||typeof r.done!=="object")delete p.roadmaps[c];else{r.cid=c;r.upd=String(r.upd||now())}}p.log=Array.isArray(p.log)?p.log:[];p.weekly=+p.weekly||0}if(!d.profiles[d.cur])d.cur=null;return d}
function fieldErr(id,msg){const i=$("#"+id);let e=$("#"+id+"-e");if(!e){e=document.createElement("p");e.id=id+"-e";e.className="ferr";e.setAttribute("role","alert");i.insertAdjacentElement("afterend",e)}e.textContent=msg;i.setAttribute("aria-invalid","true");i.setAttribute("aria-describedby",e.id);i.focus()}
document.addEventListener("input",e=>{const t=e.target,x=t.id&&$("#"+t.id+"-e");if(x){x.remove();t.removeAttribute("aria-invalid")}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pn")$("[data-a=create]").click();if(e.key==="Enter"&&e.target.id==="sn")$("[data-a=addsk2]").click()});
addEventListener("ss:consent",async()=>{if(hasConsent()){await loadSB();render()}else{try{if(SB)await SB.auth.signOut()}catch(e){}cloudUser=null;Object.keys(localStorage).filter(k=>k.startsWith("sb-")).forEach(k=>localStorage.removeItem(k));render()}});
function toast(t,e){const x=$("#toast");x.textContent=t;x.className=e?"e":"";x.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display="none",3500)}
function ask(q,y,n){return new Promise(r=>{$("#dq").textContent=q;const d=$("#dlg");d.returnValue="";d.querySelector("[value=y]").textContent=y||"Confirm";d.querySelector("[value=n]").textContent=n||"Cancel";d.onclose=()=>r(d.returnValue==="y");d.showModal()})}
function log(m){P().log.unshift({t:now(),m});P().log=P().log.slice(0,100)}
// ---------- LOGIC ----------
function gap(c){const sk=P().skills;return c.r.map(s=>{const u=sk[s];let k,w;
if(!u){k="Missing";w="No entry in your skills."}else if(u.s==="Mastered"){k="Matched";w="You marked it Mastered (self-assessed)."}else if(u.s==="To Learn"){k="Needs Review";w="On your list but not started."}else{k="In Progress";w="You marked it "+u.s+"."}return{s,k,w}})}
function score(c){const g=gap(c),n=g.length,m=g.filter(x=>x.k==="Matched").length/n,p=g.filter(x=>x.k==="In Progress").length/n,ints=P().interests,hasI=ints.length>0,i=ints.includes(c.c)?1:0;
const W=.5+.2+(hasI?.2:0);return{v:Math.round((.5*m+.2*p+(hasI?.2*i:0))/W*100),g,hasI,i}}
function rec(c){const s=score(c),m=s.g.filter(x=>x.k==="Matched").map(x=>x.s),ms_=s.g.filter(x=>x.k==="Missing").map(x=>x.s);
return `${m.length?"You have marked "+m.join(", ")+" as mastered. ":"You have no mastered skills for this role yet. "}${s.i?"It matches your declared interest in "+c.c+". ":""}${ms_.length?"Missing: "+ms_.slice(0,3).join(", ")+". ":""}`}
function rstat(rm){const c=career(rm.cid),all=ms(c),d=all.filter(x=>rm.done[x.id]).length,av=all.find(x=>!rm.done[x.id]&&x.p.every(p=>rm.done[p]));
return{c,all,d,pct:Math.round(d/all.length*100),next:av,hrs:all.filter(x=>!rm.done[x.id]).reduce((a,x)=>a+x.h,0)}}
function overall(){const r=Object.values(P().roadmaps);return r.length?Math.round(r.reduce((a,x)=>a+rstat(x).pct,0)/r.length):0}
const bar=(p,l)=>`<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="${E(l)}"><i style="width:${p}%"></i></div>`;
const bdg=t=>`<span class="badge b-${E(t.split(" ")[0])}">${E(t)}</span>`;
// ---------- VIEWS ----------
function welcome(){const ps=Object.values(db.profiles);return `<div class="welcome-layout"><div class="welcome-copy"><span class="eyebrow"><i></i> CAREER ROADMAP PLANNER</span><h1>See which skills stand between you and a tech career.</h1><p class="welcome-lede">Pick from ${CAT.length} tech careers, compare each with the skills you already have, and follow a step-by-step learning roadmap.</p><div class="welcome-points"><span>Explainable career matches</span><span>Multiple roadmaps</span><span>Local-first by design</span></div><div class="welcome-note"><span><b>Your data stays on your device.</b><small>Nothing is uploaded unless you turn on cloud sync.</small></span></div></div><div class="card welcome-panel"><div class="panel-topline"><span class="eyebrow">GET STARTED</span></div><h2>Create your profile</h2><p class="mu">Set up a local profile to keep your skills and roadmaps together on this device.</p>
${ps.length?`<div class="profile-manager-head"><h3 class="subhead">Profiles saved on this device</h3><button class="dan" data-a="delallprofiles">Remove all</button></div><div class="profile-manager">${ps.map(p=>`<div class="profile-entry"><span class="profile-name">${E(p.name)}</span><div class="profile-actions"><button data-a="open" data-id="${E(p.id)}">Open</button><button class="dan" data-a="delprofile" data-id="${E(p.id)}" aria-label="Delete profile ${E(p.name)}">Delete</button></div></div>`).join("")}</div><p class="profile-delete-note">Deleting a profile removes its saved skills, roadmaps, and progress. When Cloud Sync is signed in, the change is synced to that account.</p>`:""}
<h3 class="subhead">Your display name</h3><div class="row name-row"><label class="field-label" for="pn">Name</label><input id="pn" maxlength="30" autocomplete="off"></div>
<p class="mu interest-label">Choose interests <span>(optional)</span></p><div class="row interest-options" id="pi">${CATS.map(c=>`<label><input type="checkbox" value="${c}"> ${c}</label>`).join(" ")}</div><p class="create-action"><button class="pri" data-a="create">Create my profile</button></p><p class="fine-print">No password needed. Stored in this browser.</p></div></div>`}
function home(){const p=P(),rs=Object.values(p.roadmaps),n=s=>rs.filter(r=>r.status===s).length,mc=rs.reduce((a,r)=>a+rstat(r).d,0),mastered=Object.values(p.skills).filter(s=>s.s==="Mastered").length;
const cards=[["Careers",CAT.length],["Started roadmaps",rs.length],["Active",n("Active")],["Paused",n("Paused")],["Milestones done",mc],["Skills mastered",mastered],["Overall progress",overall()+"%"]];
const top=CAT.map(c=>({c,s:score(c)})).filter(x=>x.s.v>0).sort((a,b)=>b.s.v-a.s.v).slice(0,3);
return `<div class="page-hero dashboard-hero"><div><span class="eyebrow"><i></i> YOUR LEARNING SPACE</span><h1>Welcome back, <span>${E(p.name)}</span>.</h1><p class="page-subtitle">Small, consistent steps turn curiosity into capability. Here’s where your journey stands.</p></div><a class="btn pri hero-action" href="#/explore">Explore careers</a></div><div class="grid stat-grid">${cards.map(c=>`<div class="card"><div class="stat">${c[1]}</div><div class="mu">${c[0]}</div></div>`).join("")}</div>
<div class="section-heading"><div><span class="eyebrow">IN MOTION</span><h2>Continue learning</h2></div><a class="text-link" href="#/roadmaps">All roadmaps</a></div>${rs.length?`<div class="grid">${rs.map(roadCard).join("")}</div>`:`<div class="card">You have not started any roadmap. Browse <a href="#/explore">Explore Careers</a>, review one and choose Start This Roadmap when you are ready.</div>`}
<div class="section-heading"><div><span class="eyebrow">BASED ON YOUR PROFILE</span><h2>Suggested directions</h2></div></div><div class="card recommendation-panel"><p class="mu">Heuristic overlap scores based on skills you added and interests you chose. They do not measure ability or hiring chances.</p>${top.length?top.map(x=>`<p><b>${E(x.c.t)}</b> ${x.s.v}% overlap<br><span class="mu">${E(rec(x.c))}</span> <a href="#/career/${x.c.id}">View details</a></p>`).join(""):`<p>Add skills in <a href="#/skills">My Skills</a>${p.interests.length?"":" or choose interests in Profile"} to get explained suggestions.</p>`}</div>`}
function roadCard(r){const s=rstat(r);return `<div class="card roadmap-card"><div class="roadmap-card-head"><span class="career-glyph">${E(s.c.t.split(/\s+/).map(x=>x[0]).join("").slice(0,2))}</span>${bdg(r.status)}</div><h3>${E(s.c.t)}</h3><div class="mu">${E(s.c.c)} · ${s.d}/${s.all.length} milestones</div><div class="progress-label"><span>Roadmap progress</span><b>${s.pct}%</b></div>${bar(s.pct,s.c.t+" progress")}<p class="next-step"><span class="next-label">NEXT UP</span><br>${s.next?E(s.next.t):"All milestones complete"}</p><a class="btn" href="#/roadmap/${r.cid}">Open roadmap</a></div>`}
function explore(){return `<h1>Explore Careers</h1><div class="row"><label for="fq" class="mu">Search</label><input id="fq" type="search" aria-label="Search careers" value="${E(F.q)}"><select id="fc" aria-label="Category"><option value="">All categories</option>${CATS.map(c=>`<option ${F.c===c?"selected":""}>${c}</option>`).join("")}</select>
<select id="fl" aria-label="Level"><option value="">Any level</option>${[1,2,3].map(l=>`<option value="${l}" ${F.l==l?"selected":""}>${LV[l]}</option>`).join("")}</select><label><input id="fh" type="checkbox" ${F.h?"checked":""}> Has my roadmap</label><button data-a="clr">Clear filters</button></div><p class="mu" id="cnt" aria-live="polite"></p><div class="grid" id="res"></div>`}
function results(){const q=F.q.toLowerCase().trim(),L=CAT.filter(c=>(!q||[c.t,c.c,c.d,...c.r].join(" ").toLowerCase().includes(q))&&(!F.c||c.c===F.c)&&(!F.l||c.l==F.l)&&(!F.h||P().roadmaps[c.id]));
$("#cnt").textContent=L.length+" of "+CAT.length+" careers";$("#res").innerHTML=L.length?L.map(c=>{const s=score(c);return `<div class="card career-card"><div class="career-card-top"><span class="career-glyph">${E(c.t.split(/\s+/).map(x=>x[0]).join("").slice(0,2))}</span><span class="overlap-chip">${s.v}% skill overlap</span></div><h3>${E(c.t)}</h3><div class="badge-row">${bdg(c.c)}${bdg(LV[c.l])}</div><p>${E(c.d)}</p><div class="career-meta"><span>~${c.h} hours</span><span>${c.r.length} core skills</span></div><div class="career-mini-bar"><i style="width:${s.v}%"></i></div><a class="btn" href="#/career/${c.id}">Explore role</a></div>`}).join(""):`<div class="card">No careers match. <button data-a="clr">Clear filters</button></div>`}
function careerView(id){const c=career(id);if(!c)return `<div class="card">Career not found. <a href="#/explore">Back to Careers</a></div>`;const s=score(c),rm=P().roadmaps[id],M=ms(c);
return `<a href="#/explore">Back to Careers</a><h1>${E(c.t)}</h1><p>${E(c.d)} ${bdg(c.c)}${bdg(LV[c.l])}</p><div class="card"><h2>Your skill gap</h2><p class="mu">Heuristic overlap: <b>${s.v}%</b>. Formula: 50% mastered + 20% in progress + 20% declared interest${s.hasI?"":" (no interests set, so weights are rescaled)"}. This is not a measure of ability or hiring likelihood. Skill levels are self-reported.</p>
<ul>${s.g.map(x=>`<li>${E(x.s)} ${bdg(x.k)} <span class="mu">${E(x.w)}</span> ${x.k==="Missing"?`<button data-a="addsk" data-id="${E(x.s)}">Add to My Skills</button>`:""}</li>`).join("")}</ul><p>${E(rec(c))}</p></div>
<div class="card"><h2>Roadmap preview (about ${c.h} hours)</h2>${["Foundations","Core Skills","Projects","Portfolio"].map(st=>`<h3>${st}</h3><ul>${M.filter(m=>m.st===st).map(m=>`<li>${E(m.t)} <span class="mu">~${m.h}h</span></li>`).join("")}</ul>`).join("")}<p class="mu">Estimates are rough guides. Completing a roadmap does not guarantee a job.</p>
${rm?`<a class="btn pri" href="#/roadmap/${id}">Open Existing Roadmap</a>`:`<button class="pri" data-a="start" data-id="${id}">Start This Roadmap</button>`}</div>`}
function roadmaps(){const rs=Object.values(P().roadmaps);return `<h1>My Roadmaps</h1>${rs.length?`<div class="grid">${rs.sort((a,b)=>b.upd.localeCompare(a.upd)).map(roadCard).join("")}</div>`:`<div class="card">No roadmaps yet. Explore <a href="#/explore">careers</a> and start one when you are ready.</div>`}`}
function roadmapView(id){const rm=P().roadmaps[id];if(!rm)return `<div class="card">Roadmap not found. <a href="#/roadmaps">My Roadmaps</a></div>`;const s=rstat(rm),wk=+P().weekly||0;
return `<a href="#/roadmaps">← My Roadmaps</a><div class="row sp"><h1>${E(s.c.t)}</h1>${bdg(rm.status)}</div>${bar(s.pct,"Roadmap progress")}<p>${s.pct}% · ${s.d}/${s.all.length} milestones · ~${s.hrs}h remaining${wk?` (about ${Math.ceil(s.hrs/wk)} weeks at ${wk}h/week)`:""}</p>
<div class="row">${rm.status==="Active"?`<button data-a="pause" data-id="${id}">Pause Roadmap</button>`:rm.status==="Paused"?`<button class="pri" data-a="resume" data-id="${id}">Resume Roadmap</button>`:""}<button class="dan" data-a="rm" data-id="${id}">Remove Roadmap</button></div>
${s.all.map(m=>{const dn=rm.done[m.id],un=m.p.every(p=>rm.done[p]),miss=m.p.filter(p=>!rm.done[p]).map(p=>s.all.find(x=>x.id===p).t);
return `<div class="ms ${dn?"dn":un?"av":""}"><div class="row sp"><b>${E(m.t)}</b>${bdg(dn?"Done":un?"Available":"Locked")}</div><div class="mu">${m.st} · ~${m.h}h${m.sk&&P().skills[m.sk]?.s==="Mastered"&&!dn?" · You marked this skill Mastered; complete it only if you choose":""}</div>${!dn&&!un?`<div class="mu">Locked until: ${miss.map(E).join(", ")}</div>`:""}${!dn&&un?`<button class="${s.next&&s.next.id===m.id?"pri":""}" data-a="done" data-id="${id}" data-m="${m.id}" ${rm.status!=="Active"?"disabled title='Resume the roadmap first'":""}>Mark Complete</button>`:""}</div>`}).join("")}`}
function skills(){const sk=Object.entries(P().skills);return `<h1>My Skills</h1><div class="card"><div class="row"><input id="sn" list="sl" maxlength="40" aria-label="Skill name"><datalist id="sl">${ALLSK.map(s=>`<option value="${s}">`).join("")}</datalist><select id="ss" aria-label="Status">${STS.map(s=>`<option>${s}</option>`).join("")}</select><button class="pri" data-a="addsk2">Add Skill</button></div><p class="mu">Statuses are self-assessments. Adding a skill never completes a roadmap milestone.</p></div>
<div class="grid">${sk.length?sk.map(([n,u])=>`<div class="card"><b>${E(n)}</b> ${bdg(u.s)}<div class="row"><select data-a="sst" data-id="${E(n)}" aria-label="Status for ${E(n)}">${STS.map(s=>`<option ${s===u.s?"selected":""}>${s}</option>`).join("")}</select><button class="dan" data-a="rmsk" data-id="${E(n)}">Remove</button></div></div>`).join(""):`<div class="card">No skills yet. Add what you already know.</div>`}</div>`}
function progress(){const p=P(),rs=Object.values(p.roadmaps),tot=rs.reduce((a,r)=>a+rstat(r).all.length,0),dn=rs.reduce((a,r)=>a+rstat(r).d,0);
return `<h1>Progress Centre</h1><div class="card"><div class="stat">${overall()}%</div><div class="mu">Overall = simple average of completion % across all started roadmaps (including paused). ${dn} done, ${tot-dn} remaining.</div></div>
${rs.length?rs.map(roadCard).join(""):`<div class="card">Nothing to show yet. Start a roadmap to see progress.</div>`}<h2>Activity</h2><div class="card">${p.log.length?`<ul>${p.log.map(l=>`<li>${new Date(l.t).toLocaleString()}: ${E(l.m)}</li>`).join("")}</ul>`:"No activity yet."}</div>`}
function profile(){const p=P();return `<h1>Profile &amp; Settings</h1><div class="card"><p><b>${E(p.name)}</b></p><label>Weekly learning hours (optional)<br><input id="wk" type="number" min="0" max="80" value="${p.weekly||""}"></label> <button data-a="wk">Save</button>
<p class="row"><button data-a="exp">Export Data (JSON)</button><button data-a="out">Switch profile</button></p><p><button class="dan" data-a="reset">Reset This Profile</button></p><p class="mu">Data stays in this browser unless you turn on optional cloud sync. Recommendations are rule-based; no machine-learning model is included.</p></div><div class="card"><h2>Cloud sync (optional)</h2>${cloudCard()}</div>`}
// ---------- ROUTER ----------
const NAV=[["overview","Overview"],["explore","Explore Careers"],["roadmaps","My Roadmaps"],["skills","My Skills"],["progress","Progress Centre"],["profile","Profile"]];
function render(){const [,r,a]=(location.hash||"#/overview").split("/"),m=$("#m");$("#net").hidden=navigator.onLine;
if(!db.cur||!P()){db.cur=null;$("#nav").innerHTML="";$("#mb").hidden=true;document.title="SkillSphere | Career Roadmaps and Skill Gap Planner";m.innerHTML=welcome();return}
$("#nav").innerHTML=NAV.map(n=>`<a href="#/${n[0]}" ${(r||"overview")===n[0]||(r==="career"&&n[0]==="explore")||(r==="roadmap"&&n[0]==="roadmaps")?'aria-current="page"':""}>${n[1]}</a>`).join("");
const V={overview:home,explore,career:()=>careerView(a),roadmaps,roadmap:()=>roadmapView(a),skills,progress,profile};$("#mb").hidden=false;m.innerHTML=V[r||"overview"]?V[r||"overview"]():nf();document.title=(V[r||"overview"]?(NAV.find(n=>n[0]===(r==="career"?"explore":r==="roadmap"?"roadmaps":r||"overview"))||["","Dashboard"])[1]:"Page not found")+" | SkillSphere";if(r==="explore")results()}
function nf(){return `<h1>Page not found</h1><div class="card"><p>That page does not exist.</p><a class="btn pri" href="#/overview">Go to dashboard</a></div>`}
addEventListener("hashchange",()=>{render();scrollTo(0,0);$("#nav").classList.remove("open");$("#mb").setAttribute("aria-expanded","false");$("#m").focus({preventScroll:true})});addEventListener("online",render);addEventListener("offline",render);
document.addEventListener("input",e=>{const t=e.target;if(t.id==="fq"||t.id==="fc"||t.id==="fl"||t.id==="fh"){F.q=$("#fq").value;F.c=$("#fc").value;F.l=$("#fl").value;F.h=$("#fh").checked;results()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a==="sst"){const u=P().skills[t.dataset.id];if(u){u.s=t.value;log("Skill status: "+t.dataset.id+" changed to "+t.value);save();toast("Skill status updated.");render()}}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;const a=b.dataset.a,id=b.dataset.id,p=db.cur&&P();
if(a==="create"){const n=$("#pn").value.trim();if(!n||n.length>30)return fieldErr("pn","Enter a name between 1 and 30 characters.");const i=[...document.querySelectorAll("#pi input:checked")].map(x=>x.value),pid="p"+Date.now();
db.profiles[pid]={id:pid,name:n,interests:i,skills:{},roadmaps:{},log:[],weekly:0};db.cur=pid;if(save()){location.hash="#/overview";render()}}
else if(a==="open"){db.cur=id;save();location.hash="#/overview";render()}
else if(a==="delprofile"){const target=db.profiles[id];if(!target)return toast("That profile was not found.",1);if(!await ask(`Permanently delete the profile "${target.name}" and all its skills, roadmaps, and progress? This cannot be undone.`))return;delete db.profiles[id];if(db.cur===id)db.cur=null;if(save()){toast("Profile deleted"+(cloudUser?" and queued for cloud sync.":" from this browser."));render()}}
else if(a==="delallprofiles"){const count=Object.keys(db.profiles).length;if(!count)return toast("There are no profiles to remove.");if(!await ask("Permanently delete ALL "+count+" profiles and their saved skills, roadmaps, and progress?"+(cloudUser?" This will sync the deletion to this cloud account.":" This only affects this browser unless Cloud Sync is signed in.")+" This cannot be undone."))return;db.profiles={};db.cur=null;if(save()){toast("All profiles deleted"+(cloudUser?"; cloud sync queued.":" from this browser."));render()}}
else if(a==="clr"){Object.assign(F,{q:"",c:"",l:"",h:false});render()}
else if(a==="start"){const c=career(id);if(!c)return toast("Career not found.",1);if(p.roadmaps[id])return location.hash="#/roadmap/"+id;if(!await ask("Start the "+c.t+" roadmap? It begins with no progress."))return;
p.roadmaps[id]={cid:id,status:"Active",created:now(),upd:now(),done:{}};log("Started roadmap: "+c.t);if(save()){toast("Roadmap started.");location.hash="#/roadmap/"+id}}
else if(a==="pause"||a==="resume"){const r=p.roadmaps[id];r.status=a==="pause"?"Paused":"Active";r.upd=now();log((a==="pause"?"Paused ":"Resumed ")+career(id).t);save();toast(a==="pause"?"Roadmap paused.":"Roadmap resumed.");render()}
else if(a==="rm"){if(!await ask("Permanently remove this roadmap and its progress? This cannot be undone."))return;delete p.roadmaps[id];log("Removed roadmap: "+career(id).t);save();toast("Roadmap removed.");location.hash="#/roadmaps"}
else if(a==="done"){const r=p.roadmaps[id],m=ms(career(id)).find(x=>x.id===b.dataset.m);if(r.status!=="Active"||!m||!m.p.every(x=>r.done[x]))return toast("This milestone is not available.",1);
if(!await ask("Mark \""+m.t+"\" complete? Confirm you have done the work."))return;r.done[m.id]=now();r.upd=now();log("Completed milestone: "+m.t);
if(rstat(r).pct===100){r.status="Completed";log("Roadmap completed: "+career(id).t)}if(save())toast("Milestone completed.");render()}
else if(a==="addsk"||a==="addsk2"){const n=a==="addsk"?id:$("#sn").value.trim(),s=a==="addsk"?"To Learn":$("#ss").value;if(!n||n.length>40)return a==="addsk2"?fieldErr("sn","Enter a skill name of up to 40 characters."):toast("Enter a skill name (up to 40 characters).",1);
if(Object.keys(p.skills).some(k=>k.toLowerCase()===n.toLowerCase()))return a==="addsk2"?fieldErr("sn","That skill is already in your list."):toast("That skill is already in your list.",1);const canon=ALLSK.find(k=>k.toLowerCase()===n.toLowerCase())||n;p.skills[canon]={s,u:now()};log("Added skill: "+canon+" ("+s+")");if(save())toast("Skill added.");render()}
else if(a==="rmsk"){const aff=Object.values(p.roadmaps).filter(r=>career(r.cid).r.includes(id)).length;if(!await ask("Remove "+id+"?"+(aff?" It is required by "+aff+" of your roadmaps; their milestones are kept.":"")))return;delete p.skills[id];save();toast("Skill removed.");render()}
else if(a==="wk"){const w=$("#wk").value.trim();if(w!==""&&!/^\d{1,2}$/.test(w)||+w>80)return fieldErr("wk","Enter whole hours from 0 to 80.");p.weekly=+w||0;if(save())toast("Weekly hours saved.")}
else if(a==="out"){db.cur=null;save();toast("Switched profile. Your data is still saved on this device.");location.hash="";render()}
else if(a==="reset"){if(!await ask("Delete all skills, roadmaps and history for this profile only? This cannot be undone."))return;Object.assign(p,{skills:{},roadmaps:{},log:[]});save();toast("Profile reset.");location.hash="#/overview";render()}
else if(a==="exp"){const u=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:1,profile:p},null,2)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="skillsphere-"+p.name.replace(/\W+/g,"_")+".json";l.click();URL.revokeObjectURL(u);toast("Export downloaded.")}
else if(a==="consent"){ssConsent("all")}
else if(a==="cout"){if(SB)await SB.auth.signOut();cloudUser=null;toast("Signed out of cloud sync.");render()}
else if(a==="cin"){await loadSB();if(!SB)return;$("#ae").textContent="";$("#adlg").showModal()}
else if(a==="acancel"){$("#adlg").close()}
else if(a==="signin"||a==="signup"){const em=$("#ae1").value.trim(),pw=$("#ae2").value,er=$("#ae");if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return er.textContent="Enter a valid email address.";if(pw.length<6)return er.textContent="Use a password with at least 6 characters.";er.textContent="";b.disabled=true;const r=a==="signin"?await SB.auth.signInWithPassword({email:em,password:pw}):await SB.auth.signUp({email:em,password:pw});b.disabled=false;if(r.error)return er.textContent=r.error.message;if(!r.data.session){er.textContent="Check your email to confirm your account, then sign in.";return}cloudUser=r.data.user;$("#adlg").close();$("#ae2").value="";await cloudPull(true);toast("Signed in. Cloud sync is on.")}});
db=clean(db);render();loadSB();

</script></body></html>
