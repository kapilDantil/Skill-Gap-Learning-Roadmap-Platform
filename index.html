.sculpture-ring.r3{inset:18%;border-color:#ff986d77;transform:rotateX(25deg) rotateY(55deg) rotateZ(40deg);animation-duration:14s}

<div class="section-heading"><div><span class="eyebrow">IN MOTION</span><h2>Continue learning</h2></div><a class="text-link" href="#/roadmaps">All roadmaps <span>→</span></a></div>${rs.length?`<div class="grid">${rs.map(roadCard).join("")}</div>`:`<div class="card">You have not started any roadmap. Browse <a href="#/explore">Explore Careers</a>, review one and choose Start This Roadmap when you are ready.</div>`}

function roadCard(r){const s=rstat(r);return `<div class="card roadmap-card"><div class="roadmap-card-head"><span class="career-glyph">${E(s.c.t.split(/\s+/).map(x=>x[0]).join("").slice(0,2))}</span>${bdg(r.status)}</div><h3>${E(s.c.t)}</h3><div class="mu">${E(s.c.c)} · ${s.d}/${s.all.length} milestones</div><div class="progress-label"><span>Roadmap progress</span><b>${s.pct}%</b></div>${bar(s.pct,s.c.t+" progress")}<p class="next-step"><span class="next-label">NEXT UP</span><br>${s.next?E(s.next.t):"All milestones complete"}</p><a class="btn" href="#/roadmap/${r.cid}">Open roadmap <span>↗</span></a></div>`}
function explore(){return `<h1>Explore Careers</h1><div class="row"><input id="fq" type="search" placeholder="Search title, skill, category" aria-label="Search careers" value="${E(F.q)}"><select id="fc" aria-label="Category"><option value="">All categories</option>${CATS.map(c=>`<option ${F.c===c?"selected":""}>${c}</option>`).join("")}</select>
<select id="fl" aria-label="Level"><option value="">Any level</option>${[1,2,3].map(l=>`<option value="${l}" ${F.l==l?"selected":""}>${LV[l]}</option>`).join("")}</select><label><input id="fh" type="checkbox" ${F.h?"checked":""}> Has my roadmap</label><button data-a="clr">Clear filters</button></div><p class="mu" id="cnt" aria-live="polite"></p><div class="grid" id="res"></div>`}
function results(){const q=F.q.toLowerCase().trim(),L=CAT.filter(c=>(!q||[c.t,c.c,c.d,...c.r].join(" ").toLowerCase().includes(q))&&(!F.c||c.c===F.c)&&(!F.l||c.l==F.l)&&(!F.h||P().roadmaps[c.id]));
$("#cnt").textContent=L.length+" of "+CAT.length+" careers";$("#res").innerHTML=L.length?L.map(c=>{const s=score(c);return `<div class="card career-card"><div class="career-card-top"><span class="career-glyph">${E(c.t.split(/\s+/).map(x=>x[0]).join("").slice(0,2))}</span><span class="overlap-chip">${s.v}% match</span></div><h3>${E(c.t)}</h3><div class="badge-row">${bdg(c.c)}${bdg(LV[c.l])}</div><p>${E(c.d)}</p><div class="career-meta"><span>◷ ~${c.h} hours</span><span>✦ ${c.r.length} core skills</span></div><div class="career-mini-bar"><i style="width:${s.v}%"></i></div><a class="btn" href="#/career/${c.id}">Explore role <span>↗</span></a></div>`}).join(""):`<div class="card">No careers match. <button data-a="clr">Clear filters</button></div>`}
function careerView(id){const c=career(id);if(!c)return `<div class="card">Career not found. <a href="#/explore">Back to Careers</a></div>`;const s=score(c),rm=P().roadmaps[id],M=ms(c);
return `<a href="#/explore">← Back to Careers</a><h1>${E(c.t)}</h1><p>${E(c.d)} ${bdg(c.c)}${bdg(LV[c.l])}</p><div class="card"><h2>Your skill gap</h2><p class="mu">Heuristic overlap: <b>${s.v}%</b>. Formula: 50% mastered + 20% in progress + 20% declared interest${s.hasI?"":" (no interests set, so weights are rescaled)"}. This is not a measure of ability or hiring likelihood. Skill levels are self-reported.</p>
<ul>${s.g.map(x=>`<li>${E(x.s)} ${bdg(x.k)} <span class="mu">${E(x.w)}</span> ${x.k==="Missing"?`<button data-a="addsk" data-id="${E(x.s)}">Add to My Skills</button>`:""}</li>`).join("")}</ul><p>${E(rec(c))}</p></div>
<div class="card"><h2>Roadmap preview (about ${c.h} hours)</h2>${["Foundations","Core Skills","Projects","Portfolio"].map(st=>`<h3>${st}</h3><ul>${M.filter(m=>m.st===st).map(m=>`<li>${E(m.t)} <span class="mu">~${m.h}h</span></li>`).join("")}</ul>`).join("")}<p class="mu">Estimates are rough guides. Completing a roadmap does not guarantee a job.</p>
${rm?`<a class="btn pri" href="#/roadmap/${id}">Open Existing Roadmap</a>`:`<button class="pri" data-a="start" data-id="${id}">Start This Roadmap</button>`}</div>`}
function roadmaps(){const rs=Object.values(P().roadmaps);return `<h1>My Roadmaps</h1>${rs.length?`<div class="grid">${rs.sort((a,b)=>b.upd.localeCompare(a.upd)).map(roadCard).join("")}</div>`:`<div class="card">No roadmaps yet. Explore <a href="#/explore">careers</a> and start one when you are ready.</div>`}`}
function roadmapView(id){const rm=P().roadmaps[id];if(!rm)return `<div class="card">Roadmap not found. <a href="#/roadmaps">My Roadmaps</a></div>`;const s=rstat(rm),wk=+P().weekly||0;
return `<a href="#/roadmaps">← My Roadmaps</a><div class="row sp"><h1>${E(s.c.t)}</h1>${bdg(rm.status)}</div>${bar(s.pct,"Roadmap progress")}<p>${s.pct}% · ${s.d}/${s.all.length} milestones · ~${s.hrs}h remaining${wk?` (about ${Math.ceil(s.hrs/wk)} weeks at ${wk}h/week)`:""}</p>
<div class="row">${rm.status==="Active"?`<button data-a="pause" data-id="${id}">Pause Roadmap</button>`:rm.status==="Paused"?`<button class="pri" data-a="resume" data-id="${id}">Resume Roadmap</button>`:""}<button class="dan" data-a="rm" data-id="${id}">Remove Roadmap</button></div>
${s.all.map(m=>{const dn=rm.done[m.id],un=m.p.every(p=>rm.done[p]),miss=m.p.filter(p=>!rm.done[p]).map(p=>s.all.find(x=>x.id===p).t);
return `<div class="ms ${dn?"dn":un?"av":""}"><div class="row sp"><b>${E(m.t)}</b>${bdg(dn?"Done":un?"Available":"Locked")}</div><div class="mu">${m.st} · ~${m.h}h${m.sk&&P().skills[m.sk]?.s==="Mastered"&&!dn?" · You marked this skill Mastered; complete it only if you choose":""}</div>${!dn&&!un?`<div class="mu">Locked until: ${miss.map(E).join(", ")}</div>`:""}${!dn&&un?`<button class="pri" data-a="done" data-id="${id}" data-m="${m.id}" ${rm.status!=="Active"?"disabled title='Resume the roadmap first'":""}>Mark Complete</button>`:""}</div>`}).join("")}`}
function skills(){const sk=Object.entries(P().skills);return `<h1>My Skills</h1><div class="card"><div class="row"><input id="sn" list="sl" placeholder="Skill name" maxlength="40" aria-label="Skill name"><datalist id="sl">${ALLSK.map(s=>`<option value="${s}">`).join("")}</datalist><select id="ss" aria-label="Status">${STS.map(s=>`<option>${s}</option>`).join("")}</select><button class="pri" data-a="addsk2">Add Skill</button></div><p class="mu">Statuses are self-assessments. Adding a skill never completes a roadmap milestone.</p></div>
<div class="grid">${sk.length?sk.map(([n,u])=>`<div class="card"><b>${E(n)}</b> ${bdg(u.s)}<div class="row"><select data-a="sst" data-id="${E(n)}" aria-label="Status for ${E(n)}">${STS.map(s=>`<option ${s===u.s?"selected":""}>${s}</option>`).join("")}</select><button class="dan" data-a="rmsk" data-id="${E(n)}">Remove</button></div></div>`).join(""):`<div class="card">No skills yet. Add what you already know.</div>`}</div>`}
function progress(){const p=P(),rs=Object.values(p.roadmaps),tot=rs.reduce((a,r)=>a+rstat(r).all.length,0),dn=rs.reduce((a,r)=>a+rstat(r).d,0);
return `<h1>Progress Centre</h1><div class="card"><div class="stat">${overall()}%</div><div class="mu">Overall = simple average of completion % across all started roadmaps (including paused). ${dn} done, ${tot-dn} remaining.</div></div>
${rs.length?rs.map(roadCard).join(""):`<div class="card">Nothing to show yet. Start a roadmap to see progress.</div>`}<h2>Activity</h2><div class="card">${p.log.length?`<ul>${p.log.map(l=>`<li>${new Date(l.t).toLocaleString()} — ${E(l.m)}</li>`).join("")}</ul>`:"No activity yet."}</div>`}
function profile(){const p=P();return `<h1>Profile &amp; Settings</h1><div class="card"><p><b>${E(p.name)}</b></p><label>Weekly learning hours (optional)<br><input id="wk" type="number" min="0" max="80" value="${p.weekly||""}"></label> <button data-a="wk">Save</button>
<p class="row"><button data-a="exp">Export Data (JSON)</button><button data-a="out">Log Out</button></p><p><button class="dan" data-a="reset">Reset This Profile</button></p><p class="mu">Data stays in this browser. No passwords, accounts or network requests are used. Recommendations are rule-based; no machine-learning model is included.</p></div>`}
// ---------- ROUTER ----------
const NAV=[["overview","Overview"],["explore","Explore Careers"],["roadmaps","My Roadmaps"],["skills","My Skills"],["progress","Progress Centre"],["profile","Profile"]];
function render(){const [,r,a]=(location.hash||"#/overview").split("/"),m=$("#m");$("#net").textContent=navigator.onLine?"● Local app (online)":"● Offline mode";
if(!db.cur||!P()){db.cur=null;$("#nav").innerHTML="";m.innerHTML=welcome();return}
$("#nav").innerHTML=NAV.map(n=>`<a href="#/${n[0]}" ${(r||"overview")===n[0]||(r==="career"&&n[0]==="explore")||(r==="roadmap"&&n[0]==="roadmaps")?'aria-current="page"':""}>${n[1]}</a>`).join("");
const V={overview:home,explore,career:()=>careerView(a),roadmaps,roadmap:()=>roadmapView(a),skills,progress,profile};m.innerHTML=(V[r||"overview"]||home)();if(r==="explore")results()}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});addEventListener("online",render);addEventListener("offline",render);
document.addEventListener("input",e=>{const t=e.target;if(t.id==="fq"||t.id==="fc"||t.id==="fl"||t.id==="fh"){F.q=$("#fq").value;F.c=$("#fc").value;F.l=$("#fl").value;F.h=$("#fh").checked;results()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a==="sst"){const u=P().skills[t.dataset.id];if(u){u.s=t.value;log("Skill status: "+t.dataset.id+" → "+t.value);save();render()}}});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;const a=b.dataset.a,id=b.dataset.id,p=db.cur&&P();
if(a==="create"){const n=$("#pn").value.trim();if(!n||n.length>30)return toast("Enter a name (1–30 characters).",1);const i=[...document.querySelectorAll("#pi input:checked")].map(x=>x.value),pid="p"+Date.now();
db.profiles[pid]={id:pid,name:n,interests:i,skills:{},roadmaps:{},log:[],weekly:0};db.cur=pid;if(save()){location.hash="#/overview";render()}}
else if(a==="open"){db.cur=id;save();location.hash="#/overview";render()}
else if(a==="clr"){Object.assign(F,{q:"",c:"",l:"",h:false});render()}
else if(a==="start"){const c=career(id);if(!c)return toast("Career not found.",1);if(p.roadmaps[id])return location.hash="#/roadmap/"+id;if(!await ask("Start the "+c.t+" roadmap? It begins with no progress."))return;
p.roadmaps[id]={cid:id,status:"Active",created:now(),upd:now(),done:{}};log("Started roadmap: "+c.t);if(save()){toast("Roadmap started.");location.hash="#/roadmap/"+id}}
else if(a==="pause"||a==="resume"){const r=p.roadmaps[id];r.status=a==="pause"?"Paused":"Active";r.upd=now();log((a==="pause"?"Paused ":"Resumed ")+career(id).t);save();render()}
else if(a==="rm"){if(!await ask("Permanently remove this roadmap and its progress? This cannot be undone."))return;delete p.roadmaps[id];log("Removed roadmap: "+career(id).t);save();location.hash="#/roadmaps"}
else if(a==="done"){const r=p.roadmaps[id],m=ms(career(id)).find(x=>x.id===b.dataset.m);if(r.status!=="Active"||!m||!m.p.every(x=>r.done[x]))return toast("This milestone is not available.",1);
if(!await ask("Mark \""+m.t+"\" complete? Confirm you have done the work."))return;r.done[m.id]=now();r.upd=now();log("Completed milestone: "+m.t);
if(rstat(r).pct===100){r.status="Completed";log("Roadmap completed: "+career(id).t)}if(save())toast("Milestone completed.");render()}
else if(a==="addsk"||a==="addsk2"){const n=a==="addsk"?id:$("#sn").value.trim(),s=a==="addsk"?"To Learn":$("#ss").value;if(!n||n.length>40)return toast("Enter a skill name (up to 40 characters).",1);
if(Object.keys(p.skills).some(k=>k.toLowerCase()===n.toLowerCase()))return toast("That skill is already in your list.",1);const canon=ALLSK.find(k=>k.toLowerCase()===n.toLowerCase())||n;p.skills[canon]={s,u:now()};log("Added skill: "+canon+" ("+s+")");if(save())toast("Skill added.");render()}
else if(a==="rmsk"){const aff=Object.values(p.roadmaps).filter(r=>career(r.cid).r.includes(id)).length;if(!await ask("Remove "+id+"?"+(aff?" It is required by "+aff+" of your roadmaps; their milestones are kept.":"")))return;delete p.skills[id];save();render()}
else if(a==="wk"){p.weekly=Math.max(0,Math.min(80,+$("#wk").value||0));if(save())toast("Saved.")}
else if(a==="out"){db.cur=null;save();location.hash="";render()}
else if(a==="reset"){if(!await ask("Delete all skills, roadmaps and history for this profile only? This cannot be undone."))return;Object.assign(p,{skills:{},roadmaps:{},log:[]});save();location.hash="#/overview";render()}
else if(a==="exp"){const u=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:1,profile:p},null,2)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="skillsphere-"+p.name.replace(/\W+/g,"_")+".json";l.click();URL.revokeObjectURL(u)}});
render();
// Motion lab: cursor parallax, 3D card tilt, page transitions and scroll progress.
(function(){
 const root=document.documentElement,progress=document.querySelector('.scroll-progress i');let raf=0,px=innerWidth*.5,py=innerHeight*.35;
 const motionOK=!matchMedia('(prefers-reduced-motion: reduce)').matches;
 window.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;px=e.clientX;py=e.clientY;root.style.setProperty('--mx',px+'px');root.style.setProperty('--my',py+'px');const card=e.target.closest&&e.target.closest('.card');if(card){const r=card.getBoundingClientRect();card.style.setProperty('--lx',(px-r.left)+'px');card.style.setProperty('--ly',(py-r.top)+'px')}},{passive:true});
 // Apply subtle, bounded perspective to cards; pointer exit resets the surface.
 document.addEventListener('pointermove',e=>{if(!motionOK||e.pointerType==='touch')return;const c=e.target.closest&&e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();if(r.width>720)return;const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateX(${(-y*4.2).toFixed(2)}deg) rotateY(${(x*5.2).toFixed(2)}deg) translateY(-3px)`;c.style.setProperty('--tilt-x',(x*100)+'%');c.style.setProperty('--tilt-y',(y*100)+'%')},{passive:true});
 document.addEventListener('pointerout',e=>{const c=e.target.closest&&e.target.closest('.card');if(c&&(!e.relatedTarget||!c.contains(e.relatedTarget)))c.style.transform=''});
 const update=()=>{if(progress){const max=document.documentElement.scrollHeight-innerHeight;progress.style.transform='scaleX('+(max>0?scrollY/max:0)+')'}};
 window.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{update();raf=0})},{passive:true});window.addEventListener('resize',update,{passive:true});update();
 // Re-run staggered entrance on every route, including dynamically filtered cards.
 const animateView=()=>{const m=document.querySelector('#m');if(!m)return;const els=m.querySelectorAll('.card,.ms,.section-heading,.page-hero,.welcome-layout');els.forEach((el,i)=>{el.style.animationDelay=Math.min(i*45,450)+'ms';el.classList.remove('motion-enter');void el.offsetWidth;el.classList.add('motion-enter')})};
 const mo=new MutationObserver(()=>requestAnimationFrame(animateView));mo.observe(document.querySelector('#m'),{childList:true,subtree:false});
 document.addEventListener('click',e=>{const b=e.target.closest('button,.btn');if(!b||!motionOK)return;b.animate([{transform:'scale(1)'},{transform:'scale(.96)'},{transform:'scale(1.025)'},{transform:'scale(1)'}],{duration:330,easing:'cubic-bezier(.2,.8,.2,1)'})});
 // Scroll-linked parallax: the 3D sculpture rotates, shifts and changes scale as the page moves.
 const sculpture=document.querySelector('.scroll-sculpture');let scrollRaf=0;
 const scrollScene=()=>{const y=window.scrollY||0, vh=Math.max(1,innerHeight);root.style.setProperty('--scroll-depth',Math.min(1,y/(document.documentElement.scrollHeight-vh||1)));const saturn=document.querySelector('.saturn-scene');if(saturn&&motionOK){const depth=Math.min(1,y/(document.documentElement.scrollHeight-vh||1));saturn.style.transform=`translate3d(${Math.sin(y*.0011)*20}px,${Math.cos(y*.0015)*22}px,0) rotate(${y*.018}deg) scale(${1+Math.sin(y*.001)*.025})`;saturn.style.setProperty('--ring-spin',(y*.42)+'deg');saturn.style.opacity=String(.66+Math.sin(y*.002)*.09)}const rings=document.querySelectorAll('.saturn-ring');rings.forEach((ring,i)=>{if(motionOK)ring.style.transform=`rotate(${-21+i*2}deg) rotateX(${68+i*2}deg) rotateZ(${y*(.16+i*.09)}deg)`});if(sculpture&&motionOK){const drift=Math.sin(y*.002)*9;sculpture.style.transform=`perspective(1000px) translate3d(${Math.sin(y*.0012)*24}px,${(y*.12)%150-65}px,0) rotateX(${Math.sin(y*.0015)*13}deg) rotateY(${Math.cos(y*.001)*22}deg) rotateZ(${y*.035}deg) scale(${1+Math.sin(y*.001)*.07})`;sculpture.style.opacity=String(Math.max(.16,.72-Math.min(.5,y/(vh*4))))}if(progress){const max=document.documentElement.scrollHeight-vh;progress.style.transform='scaleX('+(max>0?y/max:0)+')'}scrollRaf=0};
 window.addEventListener('scroll',()=>{if(!scrollRaf)scrollRaf=requestAnimationFrame(scrollScene)},{passive:true});window.addEventListener('resize',scrollScene,{passive:true});scrollScene();
 // IntersectionObserver creates repeatable reveal choreography for every newly rendered screen.
 let revealObserver;
 const observeReveals=()=>{const m=document.querySelector('#m');if(!m)return;if(revealObserver)revealObserver.disconnect();if(!motionOK){m.querySelectorAll('.scroll-reveal').forEach(el=>el.classList.add('is-visible'));return}revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');revealObserver.unobserve(entry.target)}}),{threshold:.08,rootMargin:'0px 0px -5% 0px'});const targets=m.querySelectorAll('.card,.ms,.section-heading,.page-hero,.welcome-layout,main#m>h1,main#m>p,main#m>ul,.welcome-note');targets.forEach((el,i)=>{el.classList.remove('is-visible','reveal-left','reveal-right');el.classList.add('scroll-reveal');if(i%5===1)el.classList.add('reveal-left');else if(i%5===3)el.classList.add('reveal-right');el.style.setProperty('--reveal-delay',Math.min((i%5)*65,260)+'ms');revealObserver.observe(el)});};
 const revealObserverMO=new MutationObserver(()=>requestAnimationFrame(observeReveals));revealObserverMO.observe(document.querySelector('#m'),{childList:true,subtree:false});observeReveals();
 // A soft magnetic glow tracks pointer position on glass surfaces.
 document.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const c=e.target.closest&&e.target.closest('.card,.welcome-panel');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--lx',(e.clientX-r.left)+'px');c.style.setProperty('--ly',(e.clientY-r.top)+'px')},{passive:true});
})();
